name: Publish Docker Image

# The image must always be built from the released tag - never from the default
# branch HEAD - and its embedded version string must match the release binaries
# (no leading "v" inside the binary, the "v" stays in the git/image tag).
# The fixed version tag is immutable: if it already exists in the registry the
# run fails instead of re-pointing it at another digest. "latest" floats.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（镜像必须从该 tag 的源码构建，例如 v1.5.10-stable.1）"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-multi-arch:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve the release tag
        id: source
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "${TAG}" ]; then
            echo "::error::no release tag given: a versioned image is never built from the default branch"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.tag }}

      - name: Fail unless the checkout is exactly that tag
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "::error::the checkout (${HEAD_SHA}) is not the release tag ${TAG} (${TAG_SHA})"
            exit 1
          fi
          echo "building from ${TAG} at ${HEAD_SHA}"

      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # The immutability rules of a published version are the rules that
          # version shipped with: the guard comes from the tag being released,
          # never from the default branch.
          if [ ! -f .github/scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 0
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          # Same convention as the release binaries: the version compiled into
          # the agent has no "v" prefix.
          VERSION="${TAG#v}"
          LDFLAGS="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}"

          echo "Building for linux/amd64..."
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-amd64

          echo "Building for linux/arm64..."
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immutability guard for the fixed image tag
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-guard.sh image \
            "${REGISTRY}/${IMAGE_NAME}:${TAG}" \
            "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.source.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
