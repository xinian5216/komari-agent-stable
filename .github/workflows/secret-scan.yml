name: Secret Scan

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git . --log-opts="--all" --redact --exit-code 1 -v
      - name: Scan working tree
        run: gitleaks dir . --redact --exit-code 1 -v

  secret-gate:
    name: secret-gate
    if: ${{ always() }}
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full-history secret scan
        run: test "${{ needs.gitleaks.result }}" = success
