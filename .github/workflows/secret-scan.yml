name: Secret Scan

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          set -euxo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git . --log-opts="--all" --redact --exit-code 1 -v
      - name: Scan working tree
        run: gitleaks dir . --redact --exit-code 1 -v

  secret-gate:
    name: secret-gate
    if: ${{ always() }}
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full-history secret scan
        run: test "${{ needs.gitleaks.result }}" = success
