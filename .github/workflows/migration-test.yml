name: Agent migration test (official agent -> komari-agent-stable)

# 端到端验证 migrate-komari-agent.sh：
#   1. 安装真实的官方 agent 1.5.10 到 /opt/komari/agent + komari-agent.service（带 endpoint/token 参数）
#   2. 记录官方二进制打印的自更新来源（Github Repo:）
#   3. 用本仓库脚本迁移到 fork 版本（发布产物通过本地 HTTP 提供）
#   4. 校验：启动参数（endpoint/token）原样保留、二进制被替换、来源变为 fork
# 只读、无 secrets；改动只发生在这台 runner 上。

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
    paths:
      - "cmd/root.go"
      - "migrate-komari-agent.sh"
      - ".github/workflows/migration-test.yml"
  push:
    paths:
      - "migrate-komari-agent.sh"
      - ".github/workflows/migration-test.yml"

permissions:
  contents: read

jobs:
  migrate-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build the fork agent binary and serve it like a GitHub release
        run: |
          set -euxo pipefail
          go build -trimpath -ldflags "-X github.com/komari-monitor/komari-agent/update.CurrentVersion=1.5.10-stable.0" \
            -o /tmp/komari-agent-linux-amd64 .
          DEST=/tmp/site/xinian5216/komari-agent-stable/releases/download/v1.5.10-stable.0
          mkdir -p "$DEST"
          cp /tmp/komari-agent-linux-amd64 "$DEST/komari-agent-linux-amd64"
          (cd "$DEST" && sha256sum komari-agent-linux-amd64 | awk '{print $1}' > komari-agent-linux-amd64.sha256)
          (cd /tmp/site && nohup python3 -m http.server 8898 >/tmp/http-agent.log 2>&1 &)
          sleep 2
          curl -sI "http://127.0.0.1:8898/xinian5216/komari-agent-stable/releases/download/v1.5.10-stable.0/komari-agent-linux-amd64" | head -1

      - name: systemctl / journalctl stub
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stubbin /tmp/stub-systemd
          cat > /tmp/stubbin/systemctl <<'STUB'
          #!/bin/bash
          state_dir=/tmp/stub-systemd
          mkdir -p "$state_dir"
          cmd="${1:-}"; shift || true
          unit="${1:-}"
          case "$cmd" in
            is-active) [ -f "$state_dir/active" ] && exit 0 || exit 3 ;;
            start)
              exe=$(sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' "/etc/systemd/system/$unit" | head -1)
              args=$(sed -n 's/^ExecStart=[^ ]*[[:space:]]*//p' "/etc/systemd/system/$unit" | head -1)
              [ -x "$exe" ] || { echo "stub: $exe missing" >&2; exit 1; }
              # shellcheck disable=SC2086
              timeout 4 "$exe" $args >/tmp/stub-agent.log 2>&1 &
              pid=$!
              sleep 1
              if kill -0 "$pid" 2>/dev/null; then touch "$state_dir/active"; wait "$pid" 2>/dev/null || true; exit 0; fi
              wait "$pid" 2>/dev/null; rc=$?; echo "stub: exited early rc=$rc" >&2; rm -f "$state_dir/active"; exit 1 ;;
            stop) rm -f "$state_dir/active" ;;
            *) exit 0 ;;
          esac
          STUB
          sed -i 's/^          //' /tmp/stubbin/systemctl
          chmod +x /tmp/stubbin/systemctl
          cat > /tmp/stubbin/journalctl <<'JSTUB'
          #!/bin/bash
          [ -f /tmp/journal.log ] && cat /tmp/journal.log || true
          JSTUB
          sed -i 's/^          //' /tmp/stubbin/journalctl
          chmod +x /tmp/stubbin/journalctl

      - name: Install a real official agent 1.5.10 with endpoint and token
        run: |
          set -euxo pipefail
          sudo mkdir -p /opt/komari
          sudo curl -fsSL -o /opt/komari/agent \
            https://github.com/komari-monitor/komari-agent/releases/download/1.5.10/komari-agent-linux-amd64
          sudo chmod +x /opt/komari/agent
          cat > /tmp/komari-agent.service <<'UNIT'
          [Unit]
          Description=Komari Agent Service
          After=network.target
          [Service]
          Type=simple
          ExecStart=/opt/komari/agent -e http://127.0.0.1:25774 -t TESTTOKEN123456 -i 5 --disable-web-ssh --disable-remote-control
          WorkingDirectory=/opt/komari
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          sed -i 's/^          //' /tmp/komari-agent.service
          sudo cp /tmp/komari-agent.service /etc/systemd/system/komari-agent.service
          sudo sha256sum /opt/komari/agent | tee /tmp/agent-sha-before.txt

      - name: Capture the official agent update source
        run: |
          set -euxo pipefail
          sudo timeout 6 /opt/komari/agent -e http://127.0.0.1:25774 -t TESTTOKEN123456 -i 5 > /tmp/official-agent.log 2>&1 || true
          head -20 /tmp/official-agent.log
          grep -a "Github Repo:" /tmp/official-agent.log | tee /tmp/repo-before.txt
          grep -aq "komari-monitor/komari-agent" /tmp/repo-before.txt

      - name: Migrate the agent to komari-agent-stable
        run: |
          set -euxo pipefail
          sudo env PATH=/tmp/stubbin:$PATH \
            KOMARI_AGENT_RELEASE_BASE=http://127.0.0.1:8898 \
            KOMARI_TARGET_VERSION=v1.5.10-stable.0 \
            bash migrate-komari-agent.sh -y 2>&1 | tee /tmp/agent-migration.log
          grep -E "当前版本|目标版本|旧来源|目标来源|校验通过|迁移完成" /tmp/agent-migration.log || true

      - name: Verify the agent migration
        run: |
          set -euxo pipefail
          echo "--- 1) 启动参数（endpoint/token/interval）原样保留 ---"
          cat /etc/systemd/system/komari-agent.service
          grep -q -- "-e http://127.0.0.1:25774" /etc/systemd/system/komari-agent.service
          grep -q -- "-t TESTTOKEN123456" /etc/systemd/system/komari-agent.service
          grep -q -- "-i 5" /etc/systemd/system/komari-agent.service
          grep -q -- "--disable-web-ssh" /etc/systemd/system/komari-agent.service
          grep -q -- "--disable-remote-control" /etc/systemd/system/komari-agent.service
          echo "OK: endpoint / token / interval / legacy no-op flags 未被改动"

          echo "--- 2) 二进制已替换为 fork 版本 ---"
          AFTER=$(sudo sha256sum /opt/komari/agent | awk '{print $1}')
          WANT=$(sha256sum /tmp/komari-agent-linux-amd64 | awk '{print $1}')
          echo "after=$AFTER"; echo "want =$WANT"
          [ "$AFTER" = "$WANT" ]

          echo "--- 3) 旧二进制已备份 ---"
          sudo ls -la /opt/komari/ | grep -E "agent.backup|agent$"

          echo "--- 4) 新二进制的自更新来源已是 fork ---"
          sudo timeout 6 /opt/komari/agent -e http://127.0.0.1:25774 -t TESTTOKEN123456 -i 5 > /tmp/fork-agent.log 2>&1 || true
          grep -a "Github Repo:" /tmp/fork-agent.log | tee /tmp/repo-after.txt
          grep -aq "xinian5216/komari-agent-stable" /tmp/repo-after.txt
          echo "OK: Github Repo 已切换为 xinian5216/komari-agent-stable"

          echo "--- 5) --status 输出 ---"
          PATH=/tmp/stubbin:$PATH bash migrate-komari-agent.sh --status || true

      - name: Summary
        if: always()
        run: echo "Agent 迁移测试完成"
