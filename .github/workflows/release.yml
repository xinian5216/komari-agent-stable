name: Release Binaries

# Published release assets are immutable:
#   * an asset that does not exist yet is uploaded;
#   * an asset that exists with identical bytes is skipped;
#   * an asset that exists with different bytes fails the run;
#   * published assets are never deleted and re-uploaded to work around that.
# The checksum files are always derived from the bytes that are actually
# published, never from a rebuild (a rebuild is not byte-identical, so its
# hashes would describe a binary that was never released).
#
# workflow_dispatch only fills in missing *checksum* assets for an existing
# tag. A missing binary asset cannot be repaired by rebuilding: the rebuild
# would not match the release, so publish the next version instead.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（只能补齐缺失的校验和资产，例如 v1.5.10-stable.1）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Only a real release event builds and uploads binaries. A manual dispatch
  # never builds: it repairs checksum assets for a tag that is already out.
  build-binaries:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout the released tag (the source that is being built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # The immutability policy of a published version is the policy that
          # version shipped with. Nothing is fetched from the default branch: a
          # legacy tag without the guard fails closed instead of being repaired
          # by whatever the branch happens to contain today.
          if [ ! -f .github/scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # tag 用 v1.5.10-stable.0，二进制内显示的版本去掉 v 前缀
          VERSION="${VERSION#v}"
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o "$BINARY_NAME"

      - name: Upload binary to release (immutability guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          PLAN="$(mktemp)"
          bash .github/scripts/release-guard.sh assets "${REPOSITORY}" "${TAG}" "${PLAN}" "${BINARY_NAME}"
          if grep -qx "${BINARY_NAME}" "${PLAN}"; then
            gh release upload "${TAG}" "${BINARY_NAME}" --repo "${REPOSITORY}"
          else
            echo "${BINARY_NAME} is already published byte-identically; nothing to do"
          fi

  # Runs for both events: the release event (after the binaries are attached)
  # and a manual dispatch (to fill in checksum assets that are missing).
  checksums:
    needs: [build-binaries]
    if: ${{ always() && (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped') && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag (source of the guard)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # A dispatch must not change the immutability rules that were already
          # in force when the version was published, so the guard comes from the
          # tag being repaired - never from the default branch.
          if [ ! -f .github/scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - name: Download the published binaries (the only source of truth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist && cd dist
          gh release download "${TAG}" --repo "${REPOSITORY}" \
            --pattern 'komari-agent-*' --skip-existing
          # Only the binaries are hashed; the checksum assets that came down with
          # them are not part of SHA256SUMS.
          rm -f ./*.sha256
          ls -la

      - name: Generate checksums from the published bytes
        run: |
          set -euxo pipefail
          cd dist
          sha256sum komari-agent-* > SHA256SUMS
          while read -r sum name; do
            printf '%s\n' "$sum" > "${name}.sha256"
          done < SHA256SUMS
          ls -la

      - name: Upload checksum assets (immutability guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          PLAN="$(mktemp)"
          bash .github/scripts/release-guard.sh assets "${REPOSITORY}" "${TAG}" "${PLAN}" \
            dist/SHA256SUMS dist/komari-agent-*.sha256
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            gh release upload "${TAG}" "dist/${name}" --repo "${REPOSITORY}"
          done < "${PLAN}"
          if [ ! -s "${PLAN}" ]; then
            echo "every checksum asset is already published byte-identically"
          fi

      - name: Verify the checksum assets against the published binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          bash .github/scripts/release-guard.sh verify-sums "${REPOSITORY}" "${TAG}" dist/SHA256SUMS
