name: monitoring-only-ci

# Monitoring-only hard gates:
#   * removed command/PTY/file implementations cannot return
#   * legacy protocol requests fail closed
#   * old disable flags remain hidden no-ops for upgrade compatibility

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Guard the removed remote-control surface
        run: bash .github/scripts/check-remote-control-removed.sh

      - name: go vet
        run: go vet ./...

      - name: Cross compile
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: Monitoring-only security tests
        run: |
          go test ./server/ -run 'Legacy|Capabilities|Privilege|ReportPayload' -v
          go test ./update/ -run 'Checksum|Verified|SelectLatestStable|CheckAndUpdate' -v

      # TestICMPPing, TestTCPPing and TestHTTPPing talk to public hosts and need
      # raw socket privileges; they fail on an unmodified checkout in this
      # environment as well (verified against the baseline), so they are not part
      # of the gate. Everything else must pass.
      - name: go test (deterministic suite)
        run: |
          go test ./... -skip 'TestICMPPing|TestTCPPing|TestHTTPPing'

  installer-policy:
    name: installer monitoring-only policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer policy tests
        # The script starts background HTTP servers; sending its output to a
        # file keeps those children from holding the step's stdout, which would
        # otherwise stall the job even after the script exits. The run is also
        # bounded so a stall fails fast and names the last scenario reached.
        run: |
          set +e
          sudo timeout 600 bash .github/tests/test-install-remote-control.sh </dev/null > /tmp/policy.log 2>&1
          status=$?
          cat /tmp/policy.log
          exit $status

  startup-payloads:
    name: startup payloads of a monitoring-only agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agent
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/komari-agent .

      - name: Capture what a monitoring-only agent reports at startup
        run: |
          cat > /tmp/capture.py <<'PY'
          import http.server, json

          def store(method, body):
              if method == 'agent.basicInfo':
                  open('/tmp/captured-basicinfo.json', 'wb').write(body)

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  try:
                      payload = json.loads(body.decode('utf-8'))
                  except Exception:
                      payload = {}
                  store(payload.get('method'), body)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"jsonrpc":"2.0","id":1,"result":{}}')

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(('127.0.0.1', 18080), Handler).serve_forever()
          PY
          # The capture server must not inherit the step's stdout: a background
          # child holding that pipe would stall the job after the step's
          # commands finish.
          python3 /tmp/capture.py >/dev/null 2>&1 &
          sleep 1
          timeout 20 /tmp/komari-agent --endpoint http://127.0.0.1:18080 --token test-token \
            --disable-remote-control --disable-auto-update --disable-compression > /tmp/agent-disabled.log 2>&1 || true
          # --disable-auto-update matters here: the freshly built development
          # binary (version 0.0.1) would otherwise verify and install the latest
          # release, then exit before reporting anything.
          echo "--- agent log (remote control disabled) ---"
          cat /tmp/agent-disabled.log
          echo "--- captured basic info ---"
          if [ -f /tmp/captured-basicinfo.json ]; then head -c 400 /tmp/captured-basicinfo.json; else echo "(no basic info captured)"; fi
          echo

      - name: Assert the startup log and the basic info contract
        run: |
          python3 - <<'PY'
          import json

          log = open('/tmp/agent-disabled.log', 'rb').read().decode('utf-8', 'replace')
          assert 'remote control is not compiled into this build' in log, log

          # Released servers map agent.basicInfo straight onto SQL columns, so the
          # key set must not grow: an unknown key makes them answer
          # "no such column" and basic info reporting stops working.
          allowed = {'cpu_name', 'cpu_cores', 'cpu_physical_cores', 'arch', 'os',
                     'kernel_version', 'ipv4', 'ipv6', 'mem_total', 'swap_total',
                     'disk_total', 'gpu_name', 'virtualization', 'version'}
          payload = json.loads(open('/tmp/captured-basicinfo.json', 'rb').read().decode('utf-8'))
          info = payload['params']['info']
          unexpected = sorted(set(info) - allowed)
          assert not unexpected, unexpected
          assert not sorted(allowed - set(info)), sorted(allowed - set(info))
          print('OK: startup log reported the monitoring-only build and basic info keeps the released key set')
          PY

      - name: Run the monitoring-only payload tests
        run: go test ./server/ -run 'ReportEnvelope|BasicInfo|ReportPayload|Capabilities' -v

  required-gate:
    name: required-gate
    if: ${{ always() }}
    needs: [unit-tests, installer-policy, startup-payloads]
    runs-on: ubuntu-latest
    steps:
      - name: Require every agent CI gate
        run: |
          test "${{ needs.unit-tests.result }}" = success
          test "${{ needs.installer-policy.result }}" = success
          test "${{ needs.startup-payloads.result }}" = success
